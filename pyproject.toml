[project]
name = "parking-vision"
version = "0.1.0"
description = "Real-time parking occupancy analytics pipeline using NVIDIA DeepStream, Python, GStreamer, object detection, and tracking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parking_vision"]